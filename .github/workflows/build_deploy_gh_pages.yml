# This is a basic workflow to help you get started with Actions

name: Build and deploy GitHub pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "source" branch
  push:
    branches: ["source"]
  pull_request:
    branches: ["source"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    name: Build

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      - name: Upload GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/source' }}
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          # Artifact name
          # name: # optional, default is github-pages
          # Path of the directory containing the static assets.
          path: _site/
          # Duration after which artifact will expire in days.
          # retention-days: # optional, default is 1
          # v4+ excludes dotfiles by default, which silently dropped the Matrix
          # delegation files in .well-known/ (see #1261, #1263, #1264).
          include-hidden-files: true

      - name: Verify Matrix .well-known files are in the Pages artifact
        if: ${{ github.ref == 'refs/heads/source' }}
        run: |
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -qx './.well-known/matrix/server'
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -qx './.well-known/matrix/client'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    if: ${{ github.ref == 'refs/heads/source' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
